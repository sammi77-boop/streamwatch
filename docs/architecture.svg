<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>StreamWatch architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#6B6A66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="560" fill="#FFFFFF"/>

  <!-- YouTube sources -->
  <rect x="200" y="24" width="400" height="128" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="400" y="52" text-anchor="middle" font-size="17" font-weight="600" fill="#2C2C2A">YouTube</text>
  <g font-size="13.5" fill="#444441">
    <text x="228" y="80">Waiting rooms (RSS / Data API)</text><text x="572" y="80" text-anchor="end" fill="#888780">every 15 min</text>
    <text x="228" y="102">Stream status (Data API)</text><text x="572" y="102" text-anchor="end" fill="#888780">every 5 min</text>
    <text x="228" y="124">Community posts (schedule images)</text><text x="572" y="124" text-anchor="end" fill="#888780">every 3 h</text>
    <text x="228" y="146">Live page (picked image streams)</text><text x="572" y="146" text-anchor="end" fill="#888780">every 2 min</text>
  </g>

  <line x1="400" y1="154" x2="400" y2="208" stroke="#6B6A66" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- VM -->
  <rect x="150" y="214" width="420" height="150" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-dasharray="6 4"/>
  <text x="170" y="240" font-size="13" fill="#534AB7">Google Cloud VM · e2-micro, always free</text>
  <rect x="174" y="256" width="200" height="88" rx="8" fill="#FFFFFF" stroke="#AFA9EC"/>
  <text x="274" y="290" text-anchor="middle" font-size="15.5" font-weight="600" fill="#26215C">StreamWatch bot</text>
  <text x="274" y="312" text-anchor="middle" font-size="13" fill="#534AB7">Python · checks, matching,</text>
  <text x="274" y="330" text-anchor="middle" font-size="13" fill="#534AB7">time conversion</text>
  <rect x="394" y="256" width="152" height="88" rx="8" fill="#FFFFFF" stroke="#AFA9EC"/>
  <text x="470" y="296" text-anchor="middle" font-size="15.5" font-weight="600" fill="#26215C">SQLite</text>
  <text x="470" y="318" text-anchor="middle" font-size="13" fill="#534AB7">streams, picks, alerts</text>

  <!-- Gemini -->
  <line x1="574" y1="289" x2="616" y2="289" stroke="#6B6A66" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="622" y="244" width="160" height="90" rx="10" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="702" y="278" text-anchor="middle" font-size="15.5" font-weight="600" fill="#04342C">Gemini 3.8 Flash</text>
  <text x="702" y="300" text-anchor="middle" font-size="13" fill="#0F6E56">reads schedule images</text>
  <text x="702" y="318" text-anchor="middle" font-size="12" fill="#0F6E56">Google Agent Platform</text>

  <!-- Outputs -->
  <line x1="270" y1="408" x2="270" y2="368" stroke="#6B6A66" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="290" y1="368" x2="290" y2="408" stroke="#6B6A66" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="470" y1="368" x2="470" y2="408" stroke="#6B6A66" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="160" y="414" width="240" height="86" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="280" y="446" text-anchor="middle" font-size="15.5" font-weight="600" fill="#2C2C2A">Discord</text>
  <text x="280" y="468" text-anchor="middle" font-size="13" fill="#5F5E5A">in: commands, /drop images</text>
  <text x="280" y="486" text-anchor="middle" font-size="13" fill="#5F5E5A">out: cards, schedules, alerts</text>

  <rect x="420" y="414" width="200" height="86" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="520" y="446" text-anchor="middle" font-size="15.5" font-weight="600" fill="#2C2C2A">Google Calendar</text>
  <text x="520" y="468" text-anchor="middle" font-size="13" fill="#5F5E5A">streams I pick</text>

  <text x="400" y="538" text-anchor="middle" font-size="12.5" fill="#888780">Every connection goes through the VM. Running cost: under $1/month (Gemini only).</text>
</svg>
