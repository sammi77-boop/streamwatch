<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>StreamWatch evaluation architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#6B6A66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="600" fill="#FFFFFF"/>

  <!-- 1. Collect -->
  <rect x="230" y="24" width="340" height="76" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="400" y="54" text-anchor="middle" font-size="16.5" font-weight="600" fill="#2C2C2A">1. Collect the questions</text>
  <text x="400" y="78" text-anchor="middle" font-size="13.5" fill="#5F5E5A">22 schedule images from YouTube community posts</text>

  <path d="M330 100 L330 124 L200 124 L200 150" fill="none" stroke="#6B6A66" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M470 100 L470 124 L600 124 L600 150" fill="none" stroke="#6B6A66" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 2. Answer key -->
  <rect x="50" y="156" width="300" height="76" rx="10" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="200" y="186" text-anchor="middle" font-size="16.5" font-weight="600" fill="#04342C">2. Answer key: Claude</text>
  <text x="200" y="210" text-anchor="middle" font-size="13.5" fill="#0F6E56">Reads each image, writes correct start times</text>
  <line x1="200" y1="232" x2="200" y2="262" stroke="#6B6A66" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="50" y="268" width="300" height="76" rx="10" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="200" y="298" text-anchor="middle" font-size="16.5" font-weight="600" fill="#04342C">Cross-check</text>
  <text x="200" y="322" text-anchor="middle" font-size="13.5" fill="#0F6E56">Against YouTube's actual start times</text>

  <!-- 3. Exam -->
  <rect x="450" y="156" width="300" height="76" rx="10" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="600" y="186" text-anchor="middle" font-size="16.5" font-weight="600" fill="#26215C">3. Exam: Gemini 3.8 Flash</text>
  <text x="600" y="210" text-anchor="middle" font-size="13.5" fill="#534AB7">Reads each image like the bot does</text>
  <line x1="600" y1="232" x2="600" y2="262" stroke="#6B6A66" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="450" y="268" width="300" height="76" rx="10" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="600" y="298" text-anchor="middle" font-size="16.5" font-weight="600" fill="#26215C">The bot's own checks</text>
  <text x="600" y="322" text-anchor="middle" font-size="13.5" fill="#534AB7">Passed, or flagged as tentative</text>
  <text x="600" y="366" text-anchor="middle" font-size="12.5" fill="#888780">Readings are saved, so re-grading is free</text>

  <!-- 4. Compare + report -->
  <path d="M200 344 L200 410 L338 410" fill="none" stroke="#6B6A66" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M600 378 L600 410 L462 410" fill="none" stroke="#6B6A66" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="340" y="388" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="400" y="415" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Compare</text>
  <line x1="400" y1="432" x2="400" y2="464" stroke="#6B6A66" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="200" y="470" width="400" height="76" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="400" y="500" text-anchor="middle" font-size="16.5" font-weight="600" fill="#2C2C2A">4. Report card</text>
  <text x="400" y="524" text-anchor="middle" font-size="13.5" fill="#5F5E5A">Correct · silent errors · flagged · missed</text>

  <text x="400" y="578" text-anchor="middle" font-size="12.5" fill="#888780">Runs on the same Google Cloud VM as the bot · Gemini free tier, with the paid route as fallback</text>
</svg>
